<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="690" viewBox="0 0 1120 690" role="img" aria-labelledby="title" data-screen-id="SCR01" data-state-id="SCR01.STB01-6" data-storyboard-id="STB01" data-step-id="STB01-6">
  <title id="title">First Run — Use these locations becomes available after explicit approval.</title>
  <g font-family="Liberation Sans,sans-serif">
    <rect x="0" y="0" width="1120" height="690" rx="0" fill="#f4f5f2" />
    <rect x="0" y="0" width="338" height="690" rx="0" fill="#1e312a" />
    <circle cx="55" cy="53" r="15" fill="#a9ceb3" />
    <circle cx="55" cy="53" r="5" fill="#1e312a" />
    <text x="81" y="61" font-size="23" fill="#ffffff" text-anchor="start" font-weight="700">Beets Man</text>
    <text x="43" y="192" font-size="38" fill="#ffffff" text-anchor="start" font-weight="700">First Run</text>
    <text x="44" y="229" font-size="16" fill="#d4e6d9" text-anchor="start">Set up this desktop for a local</text>
    <text x="44" y="254" font-size="16" fill="#d4e6d9" text-anchor="start">music catalog and playback.</text>
    <text x="388" y="97" font-size="29" fill="#202724" text-anchor="start" font-weight="700">Storage on this desktop</text>
    <text x="388" y="127" font-size="14" fill="#4c5953" text-anchor="start">These locations are used when Beets Man first opens.</text>
    <text x="388" y="189" font-size="12" fill="#4c5953" text-anchor="start" font-weight="700">Configuration file</text>
    <rect x="388" y="199" width="657" height="36" rx="4" fill="#ffffff" stroke="#d4dbd5" />
    <text x="399" y="222" font-size="13" fill="#202724" text-anchor="start">~/.config/beets-man/appsettings.json</text>
    <text x="388" y="285" font-size="12" fill="#4c5953" text-anchor="start" font-weight="700">Local database</text>
    <rect x="388" y="295" width="657" height="36" rx="4" fill="#ffffff" stroke="#d4dbd5" />
    <text x="399" y="318" font-size="13" fill="#202724" text-anchor="start">~/.local/share/beets-man/library.db</text>
    <text x="388" y="381" font-size="12" fill="#4c5953" text-anchor="start" font-weight="700">Music folder</text>
    <rect x="388" y="391" width="657" height="36" rx="4" fill="#ffffff" stroke="#d4dbd5" />
    <text x="399" y="414" font-size="13" fill="#202724" text-anchor="start">~/Music</text>
    <rect x="388" y="462" width="657" height="62" rx="5" fill="#e0ede4" />
    <rect x="388" y="462" width="3" height="62" rx="1" fill="#235943" />
    <text x="401" y="482" font-size="13" fill="#235943" text-anchor="start" font-weight="700">A local catalog is required</text>
    <text x="401" y="502" font-size="12" fill="#235943" text-anchor="start">The database lives on this computer. Music can be browsed from cache when its folder is unavailable.</text>
    <rect x="936" y="580" width="109" height="37" rx="5" fill="#235943" stroke="#235943" />
    <text x="990.5" y="603.5" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700" data-control-id="SCR01.C01">Use defaults</text>
    <rect x="785" y="580" width="141" height="37" rx="5" fill="#ffffff" stroke="#d4dbd5" />
    <text x="855.5" y="603.5" font-size="13" fill="#202724" text-anchor="middle" font-weight="700" data-control-id="SCR01.C02">Choose locations</text>
    <rect x="338" y="0" width="782" height="690" fill="#f4f5f2" stroke="none" rx="0" />
    <text x="388" y="97" fill="#202724" font-size="29" font-weight="700">Choose storage locations</text>
    <text x="388" y="125" fill="#4c5953" font-size="14" font-weight="400">Review the paths before creating the local configuration.</text>
    <text x="388" y="158" fill="#4c5953" font-size="12" font-weight="700">Configuration file</text>
    <rect x="388" y="168" width="529" height="36" fill="#ffffff" stroke="#d4dbd5" rx="4" />
    <text x="399" y="191" fill="#202724" font-size="13" font-weight="400">~/.config/beets-man/appsettings.json</text>
    <rect x="934" y="168" width="111" height="37" fill="#ffffff" stroke="#d4dbd5" rx="5" />
    <text x="989.5" y="192" fill="#202724" font-size="13" font-weight="700" text-anchor="middle">Browse…</text>
    <text x="388" y="238" fill="#4c5953" font-size="12" font-weight="700">Local database</text>
    <rect x="388" y="248" width="529" height="36" fill="#ffffff" stroke="#d4dbd5" rx="4" />
    <text x="399" y="271" fill="#202724" font-size="13" font-weight="400">~/.local/share/beets-man/catalog/library.db</text>
    <rect x="934" y="248" width="111" height="37" fill="#ffffff" stroke="#d4dbd5" rx="5" />
    <text x="989.5" y="272" fill="#202724" font-size="13" font-weight="700" text-anchor="middle">Browse…</text>
    <text x="388" y="318" fill="#4c5953" font-size="12" font-weight="700">Music folder</text>
    <rect x="388" y="328" width="529" height="36" fill="#ffffff" stroke="#d4dbd5" rx="4" />
    <text x="399" y="351" fill="#202724" font-size="13" font-weight="400">~/Music/Records</text>
    <rect x="934" y="328" width="111" height="37" fill="#ffffff" stroke="#d4dbd5" rx="5" />
    <text x="989.5" y="352" fill="#202724" font-size="13" font-weight="700" text-anchor="middle">Browse…</text>
    <rect x="388" y="398" width="657" height="93" fill="#fbeddc" stroke="none" rx="5" />
    <text x="401" y="420" fill="#704621" font-size="13" font-weight="700">A catalog does not exist at the selected path</text>
    <rect x="401" y="433" width="16" height="16" fill="#235943" stroke="#235943" rx="3" />
    <path d="M404 441l3 3 6-7" fill="none" stroke="#ffffff" stroke-width="2" />
    <text x="428" y="446" fill="#202724" font-size="13" font-weight="400">Create a local database at this path</text>
    <text x="428" y="471" fill="#4c5953" font-size="12" font-weight="400">The database must stay on this computer.</text>
    <rect x="785" y="544" width="100" height="37" fill="#ffffff" stroke="#d4dbd5" rx="5" />
    <text x="835.0" y="568" fill="#202724" font-size="13" font-weight="700" text-anchor="middle">Back</text>
    <rect x="895" y="544" width="150" height="37" fill="#235943" stroke="#235943" rx="5" />
    <text x="970.0" y="568" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Use these locations</text>
  </g>
</svg>
