<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="690" viewBox="0 0 1120 690" role="img" aria-labelledby="title" data-screen-id="SCR31" data-state-id="SCR31.S0">
  <title id="title">Notifications Settings</title>
