      <rect x="365" y="387" width="82" height="37" rx="5" fill="#ffffff" stroke="#d4dbd5" />
      <text x="406.0" y="410.5" font-size="13" fill="#202724" text-anchor="middle" font-weight="700" data-control-id="SCR33.C02">Cancel</text>
