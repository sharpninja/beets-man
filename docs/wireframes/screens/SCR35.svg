<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="690" viewBox="0 0 1120 690" role="img" aria-labelledby="title" data-screen-id="SCR35" data-state-id="SCR35.S0">
  <title id="title">Library Setup</title>
  <g font-family="Liberation Sans,sans-serif" id="screen-content">
    <use href="SCR05.svg#screen-content" data-omit-controls="true" />
    <rect x="0" y="0" width="1120" height="690" fill="rgba(19,33,27,0.57)" stroke="none" rx="0" />
    <g transform="translate(200 87)" role="group" aria-label="Library Setup">
      <rect x="0" y="0" width="720" height="516" rx="10" fill="#ffffff" stroke="#d4dbd5" />
      <text x="24" y="38" font-size="24" fill="#202724" text-anchor="start" font-weight="700">Library Setup</text>
      <text x="696" y="36" font-size="21" fill="#4c5953" text-anchor="end">×</text>
      <text x="24" y="61" font-size="13" fill="#4c5953" text-anchor="start">Connect Beets Man to a library on studio-host.</text>
      <line x1="0" y1="76" x2="720" y2="76" stroke="#d4dbd5" stroke-width="1" />
      <rect x="24" y="95" width="672" height="61" rx="5" fill="#e0ede4" stroke="#235943" />
      <circle cx="46" cy="121" r="8" fill="#235943" />
      <circle cx="46" cy="121" r="5" fill="#ffffff" />
      <circle cx="46" cy="121" r="3" fill="#235943" />
      <text x="64" y="120" font-size="14" fill="#202724" text-anchor="start" font-weight="700">Open existing library</text>
      <text x="64" y="141" font-size="12" fill="#4c5953" text-anchor="start">Use the host’s current beets configuration.</text>
      <text x="39" y="180" font-size="12" fill="#4c5953" text-anchor="start" font-weight="700">Host configuration path</text>
      <rect x="39" y="190" width="642" height="36" rx="4" fill="#ffffff" stroke="#d4dbd5" />
      <text x="50" y="213" font-size="13" fill="#202724" text-anchor="start">/srv/beets/config.yaml</text>
      <rect x="24" y="247" width="672" height="61" rx="5" fill="#ffffff" stroke="#d4dbd5" />
      <circle cx="46" cy="273" r="8" fill="#4c5953" />
      <circle cx="46" cy="273" r="5" fill="#ffffff" />
      <text x="64" y="272" font-size="14" fill="#202724" text-anchor="start" font-weight="700">Initialize a library</text>
      <text x="64" y="293" font-size="12" fill="#4c5953" text-anchor="start">Create a configuration and catalog on the host.</text>
      <text x="39" y="333" font-size="12" fill="#4c5953" text-anchor="start" font-weight="700">Host music directory</text>
      <rect x="39" y="343" width="642" height="36" rx="4" fill="#ffffff" stroke="#d4dbd5" />
      <text x="50" y="366" font-size="13" fill="#202724" text-anchor="start">/srv/music</text>
      <text x="39" y="412" font-size="12" fill="#4c5953" text-anchor="start">Connected as Library operator</text>
      <line x1="0" y1="450" x2="720" y2="450" stroke="#d4dbd5" stroke-width="1" />
      <rect x="586" y="465" width="110" height="37" rx="5" fill="#235943" stroke="#235943" />
      <text x="641.0" y="488.5" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700" data-control-id="SCR35.C01">Open library</text>
      <rect x="490" y="465" width="86" height="37" rx="5" fill="#ffffff" stroke="#d4dbd5" />
      <text x="533.0" y="488.5" font-size="13" fill="#202724" text-anchor="middle" font-weight="700" data-control-id="SCR35.C02">Initialize</text>
