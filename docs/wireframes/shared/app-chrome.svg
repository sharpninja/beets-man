<svg xmlns="http://www.w3.org/2000/svg">
  <defs>
    <g id="desktop-brand">
      <rect x="0" y="0" width="1120" height="690" rx="0" fill="#f4f5f2" />
      <rect x="0" y="0" width="1120" height="65" rx="0" fill="#1e312a" />
      <circle cx="35" cy="32" r="13" fill="#9ec9ab" />
      <circle cx="35" cy="32" r="5" fill="#1e312a" />
      <text x="58" y="39" font-size="21" fill="#ffffff" text-anchor="start" font-weight="700">Beets Man</text>
    </g>
    <g id="desktop-status">
      <circle cx="948" cy="32" r="4" fill="#a9dabc" />
      <text x="960" y="37" font-size="12" fill="#dbe7df" text-anchor="start">Studio desktop</text>
    </g>
    <g id="secondary-navigation-background">
      <rect x="0" y="65" width="1120" height="49" rx="0" fill="#ffffff" />
      <line x1="0" y1="114" x2="1120" y2="114" stroke="#d4dbd5" stroke-width="1" />
    </g>
    <g id="library-jobs-header">
      <use href="#desktop-brand" />
      <rect x="224" y="17" width="73" height="32" rx="5" fill="#365447" />
      <text x="236" y="38" font-size="14" fill="#ffffff" text-anchor="start" font-weight="700">Library</text>
      <use href="#desktop-nav-now-playing" />
      <use href="#desktop-nav-sync" />
      <use href="#desktop-nav-settings" />
      <use href="#desktop-status" />
    </g>
    <g id="player-header">
      <use href="#desktop-brand" />
      <use href="#desktop-nav-library" />
      <rect x="345" y="17" width="110" height="32" rx="5" fill="#365447" />
      <text x="357" y="38" font-size="14" fill="#ffffff" text-anchor="start" font-weight="700">Now Playing</text>
      <use href="#desktop-nav-sync" />
      <use href="#desktop-nav-settings" />
      <use href="#desktop-status" />
    </g>
    <g id="settings-header">
      <use href="#desktop-brand" />
      <use href="#desktop-nav-library" />
      <use href="#desktop-nav-now-playing" />
      <use href="#desktop-nav-sync" />
      <rect x="597" y="17" width="82" height="32" rx="5" fill="#365447" />
      <text x="609" y="38" font-size="14" fill="#ffffff" text-anchor="start" font-weight="700">Settings</text>
      <use href="#desktop-status" />
    </g>
    <g id="sync-header">
      <use href="#desktop-brand" />
      <use href="#desktop-nav-library" />
      <use href="#desktop-nav-now-playing" />
      <rect x="502" y="17" width="59" height="32" rx="5" fill="#365447" />
      <text x="514" y="38" font-size="14" fill="#ffffff" text-anchor="start" font-weight="700">Sync</text>
      <use href="#desktop-nav-settings" />
      <use href="#desktop-status" />
    </g>
    <g id="library-workspace-header">
      <rect x="0" y="0" width="1120" height="690" fill="#f4f5f2" stroke="none" rx="0" />
      <rect x="0" y="0" width="1120" height="65" fill="#1e312a" stroke="none" rx="0" />
      <circle cx="34" cy="32" r="12" fill="#9ec9ab" />
      <circle cx="34" cy="32" r="4" fill="#1e312a" />
      <text x="57" y="39" fill="#ffffff" font-size="20" font-weight="700">Beets Man</text>
      <rect x="220" y="16" width="86" height="32" fill="#365447" stroke="none" rx="5" />
      <text x="238" y="37" fill="#ffffff" font-size="14" font-weight="700">Library</text>
      <text x="333" y="37" fill="#d7e6dd" font-size="14" font-weight="400">Now Playing</text>
      <text x="468" y="37" fill="#d7e6dd" font-size="14" font-weight="400">Sync</text>
      <text x="548" y="37" fill="#d7e6dd" font-size="14" font-weight="400">Settings</text>
      <text x="963" y="37" fill="#d7e6dd" font-size="12" font-weight="400">Studio desktop</text>
    </g>
    <g id="desktop-nav-now-playing">
      <text x="357" y="38" font-size="14" fill="#c3d1c9" text-anchor="start">Now Playing</text>
    </g>
    <g id="desktop-nav-sync">
      <text x="514" y="38" font-size="14" fill="#c3d1c9" text-anchor="start">Sync</text>
    </g>
    <g id="desktop-nav-settings">
      <text x="609" y="38" font-size="14" fill="#c3d1c9" text-anchor="start">Settings</text>
    </g>
    <g id="desktop-nav-library">
      <text x="236" y="38" font-size="14" fill="#c3d1c9" text-anchor="start">Library</text>
    </g>
  </defs>
</svg>
